name: Build site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate tarot data
        run: npm run test:cards
      - name: Validate browser tools syntax
        run: npm run test:tools
      - name: Validate maps and interaction regressions
        run: npm run test:map && npm run test:regression
      - name: Generate site
        run: npm run build
      - name: Validate generated feeds and metadata
        run: npm run test:metadata
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate real browser interactions
        run: npm run test:browser
        timeout-minutes: 5
      - name: Validate account integration
        run: npm run test:account
        timeout-minutes: 2
      - name: Validate comments UI
        run: npm run test:comments
        timeout-minutes: 2
      - name: Validate account data sync
        run: npm run test:cloud
        timeout-minutes: 3
      - name: Validate discussions
        run: npm run test:discuss
        timeout-minutes: 3
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  comments-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/comments/package-lock.json
      - run: npm ci --prefix workers/comments --omit=dev
      - run: npm test --prefix workers/comments
