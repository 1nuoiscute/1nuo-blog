# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 1nuo
subtitle: ''
keywords:
author: 1nuo
language: zh-CN
timezone: ''
# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.1nuo.me
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Match Vercel cleanUrls and canonical directory URLs.
  trailing_html: false # Publish clean canonical links while keeping generated files.
# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "explore/app/**"
  - "explore/scl90-app/**"
  - "explore/bingo-app/**"
  - "explore/bingo2-app/**"
  - "explore/bingo3-app/**"
  - "explore/bingo4-app/**"
  - "explore/bingo5-app/**"
  - "explore/draw-app/**"
  - "explore/tarot-app/**"
  - "explore/game2048-app/**"
  - "rate/admin/**"
  - "rate/rateimg/**"
# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -top -date
topindex_generator:
  per_page: 10
  order_by: -top -date
# Category & Tag
default_category: uncategorized
category_map:
tag_map:
# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true
# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'
# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page
# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:
# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly
# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:1nuoiscute/1nuoiscute.github.io.git
  branch: main
# Search
search:
  path: search.json
  field: all
  content: true
  format: html
hide_posts:
  enable: true
  filter: hide 
  noindex: true
  # 注意：这里必须严格使用单数形式的生成器名称
  allowlist_generators: ['category', 'archive', 'tag'] 
  blocklist_generators: ['index']

# Used by hexo-generator-robotstxt (site-level plugins do not read theme config).
robotstxt:
  useragent: '*'
  allow:
    - /
  # Keep /rate/admin/ crawlable so robots meta / X-Robots-Tag can be read.
  # Disallow would prevent crawlers seeing noindex; this is not authentication.
  disallow: []
  sitemap: https://www.1nuo.me/sitemap.xml

# Plugin supports sitemap:false and skip_render, not an exclude option.
# scripts/site-metadata.js also filters private/hidden/noindex and raw assets.
sitemap:
  path: sitemap.xml
  tags: false
  categories: false
  



# Public blog subscriptions (hidden/private/password posts are filtered).
feed:
  type: [atom, rss2]
  path: [atom.xml, rss.xml]
  limit: 20
  content: false
  order_by: -date
  autodiscovery: true

# Math rendering
math:
  use: mathjax
  per_page: true
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none
  katex:
